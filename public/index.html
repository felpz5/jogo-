<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bingo Patologia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <!-- Partículas de fundo -->
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="login-container">
    <div class="login-box">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-ring">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <rect x="2"  y="2"  width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.9"/>
            <rect x="16" y="2"  width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.5"/>
            <rect x="30" y="2"  width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.25"/>
            <rect x="2"  y="16" width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.5"/>
            <rect x="16" y="16" width="12" height="12" rx="3" fill="#fce7f3"/>
            <rect x="30" y="16" width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.5"/>
            <rect x="2"  y="30" width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.25"/>
            <rect x="16" y="30" width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.5"/>
            <rect x="30" y="30" width="12" height="12" rx="3" fill="#f9a8d4" opacity="0.9"/>
          </svg>
        </div>
      </div>

      <h1>Bingo Patologia</h1>
      <p class="login-subtitle">Patologia Geral &amp; Apendicite Aguda</p>

      <div class="input-wrapper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="#94a3b8"/>
        </svg>
        <input type="text" id="nameInput" placeholder="Digite seu nome..." maxlength="100" autocomplete="off"/>
      </div>

      <button class="login-btn" id="enterBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Entrar no Jogo
      </button>

      <p id="loginError" class="error"></p>

      <div class="login-footer">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#475569" stroke-width="2" stroke-linejoin="round"/></svg>
        Monitores entram com seu nome cadastrado
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="login.js"></script>
</body>
</html>
